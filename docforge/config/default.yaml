# DocForge default configuration.
# A project's own config.yaml is merged on top of this file (deep merge),
# so a project only needs to list the settings it changes.

project:
  topic: ""
  target_minutes: 15
  style: "premium cinematic documentary"
  language: "en"
  aspect_ratio: "16:9"
  resolution: [1920, 1080]
  fps: 30
  render_4k: false

planning:
  words_per_minute: 150       # narration speed used to size the script
  min_scene_seconds: 3.0      # pacing: shortest shot
  target_scene_seconds: 6.0   # pacing: typical shot
  max_scene_seconds: 8.0      # pacing: a scene longer than this gets extra shots
  max_same_kind_in_a_row: 4   # pacing: flag runs of the same visual kind

llm:
  provider: "manual"          # "claude" (needs ANTHROPIC_API_KEY or an `ant auth login` profile) or "manual"
  model: "claude-opus-5-5"
  effort: "high"
  web_search_max_uses: 20

research:
  topics:
    - Historical background
    - Geography
    - Political development
    - Major historical events
    - Population
    - Natural resources
    - Economy
    - Trade
    - Major industries
    - Infrastructure
    - Government policies
    - International relations
    - Problems and challenges
    - Important statistics
    - Future prospects

script:
  structure:
    - Hook
    - Why this country matters
    - Origins
    - History
    - Geography
    - Turning point
    - Economic transformation
    - Key policies
    - People & society
    - Global role
    - Problems
    - Future
    - Conclusion
  banned_openers:
    - "welcome to our channel"
    - "welcome back"
    - "in this video"

assets:
  # Providers are tried in order for photo-type scenes.
  photo_providers: ["openverse", "loc", "nasa", "wikimedia"]
  ai_image_provider: "none"   # "fal" to generate images for ai_image scenes
  ai_video_provider: "none"   # "fal" to generate clips for ai_video scenes
  min_width: 1000             # present-day photos (Flickr via Openverse is often 1024 px)
  min_width_archival: 640     # scenes set before 1980
  min_relevance: 0.34         # share of query words a candidate's title/tags must match
  allowed_licenses: ["cc0", "pdm", "by", "by-sa", "public domain", "no known restrictions"]
  user_agent: "DocForge/0.1 (documentary production; https://github.com/aristotlepolitics21-hash/YouTube-)"
  request_delay_seconds: 1.0
  candidates_per_query: 20
  fal:
    image_model: "fal-ai/flux/dev"
    video_model: "fal-ai/kling-video/v2.1/standard/image-to-video"
    video_seconds: 5

graphics:
  font_bold: ["/usr/share/fonts/opentype/inter/InterDisplay-Bold.otf", "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"]
  font_regular: ["/usr/share/fonts/opentype/inter/Inter-Regular.otf", "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"]
  colors:
    background: "#0B0F14"
    surface: "#151B23"
    text: "#F2F4F7"
    muted: "#98A2B3"
    accent: "#E8B04B"
    accent2: "#4FA3C7"
    negative: "#E5604D"
    land: "#2A3441"
    land_highlight: "#E8B04B"
    sea: "#0B1622"
  map_data_url: "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_admin_0_countries.geojson"

voiceover:
  provider: "piper"           # "piper" (offline, free) or "elevenlabs"
  piper_voice: "en_US-ryan-high"
  piper_voice_dir: "~/.cache/docforge/voices"
  length_scale: 1.2           # >1 speaks slower; en_US-ryan-high is ~170 wpm at 1.05, ~150 at 1.2
  sentence_silence: 0.3
  scene_gap_seconds: 0.5      # pause between scenes
  section_gap_seconds: 1.2    # pause when a new section starts
  pronunciations: {}          # {"written form": "spoken form"}
  elevenlabs:
    voice_id: ""
    model_id: "eleven_multilingual_v2"

subtitles:
  aligner: "whisper"          # "whisper" (word timings from audio) or "proportional"
  whisper_model: "base.en"
  max_chars_per_line: 42
  max_lines: 2
  burn_in: false              # YouTube CC is better; burn-in is forced for Shorts

editor:
  crossfade_seconds: 0.5      # within a section
  section_dip_seconds: 0.5    # dip to black between sections
  ken_burns_zoom: 0.08        # how far photos push in or out over a shot
  video_crf: 18
  video_preset: "medium"
  intermediate_preset: "veryfast"
  music:
    library_dir: ""           # folder of licensed tracks; files named <mood>_*.mp3/.wav
    procedural_fallback: true # synthesize an ambient bed if no track fits
    volume_db: -20            # bed level before ducking
    duck_db: 10               # extra reduction while narration plays
  sfx:
    library_dir: ""
    procedural_fallback: true
    whoosh_on_section_change: true
    volume_db: -18
  target_lufs: -14
  true_peak_db: -1.5

quality_control:
  black_min_seconds: 1.0
  black_pixel_threshold: 0.06  # dark title cards sit just above this
  silence_max_seconds: 2.5
  clip_peak_db: -0.1
  narration_match_min: 0.80   # word-level similarity between script and transcribed audio
  min_length_ratio: 0.9       # fail QC if the film is shorter than this share of target_minutes
  duplicate_hash_distance: 6

render:
  shorts:
    count: 3
    min_seconds: 30
    max_seconds: 58

cost:
  limit_usd: 5.00             # ask before any stage whose estimate exceeds this
  prices:
    claude_input_per_mtok: 4.00
    claude_output_per_mtok: 20.00
    web_search_per_1k: 10.00
    fal_image_each: 0.025
    fal_video_per_second: 0.05
    elevenlabs_per_1k_chars: 0.30
