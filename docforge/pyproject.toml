[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docforge"
version = "0.1.0"
description = "Resumable, modular pipeline for long-form documentary videos"
requires-python = ">=3.10"
dependencies = ["requests", "Pillow", "numpy", "PyYAML", "pydantic", "piper-tts"]

[project.optional-dependencies]
whisper = ["faster-whisper"]
claude = ["anthropic>=1.0"]
dev = ["pytest"]

[project.scripts]
docforge = "docforge.cli:main"

[tool.setuptools.packages.find]
include = ["docforge*"]

[tool.setuptools.package-data]
docforge = ["ui/index.html"]
