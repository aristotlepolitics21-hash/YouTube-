<!doctype html><meta charset="utf-8">
<style>
@font-face { font-family: SG; font-weight: 600; src: url(../fonts/space-grotesk-latin-600-normal.woff2); }
@font-face { font-family: SG; font-weight: 700; src: url(../fonts/space-grotesk-latin-700-normal.woff2); }
@font-face { font-family: IS; font-style: italic; src: url(../fonts/instrument-serif-latin-400-italic.woff2); }
@font-face { font-family: JB; font-weight: 500; src: url(../fonts/jetbrains-mono-latin-500-normal.woff2); }
@font-face { font-family: JB; font-weight: 700; src: url(../fonts/jetbrains-mono-latin-700-normal.woff2); }
body { margin: 0; background: #000; }
</style>
<canvas id="cv" width="1080" height="1920"></canvas>
<script>
// Money Shorts: flat illustrated explainers on halftone paper. A headline with an orange italic accent word,
// a prop card for each beat, and a cartoon presenter who talks, gestures and reacts.
// window.setup(data) loads the beats; window.__at(T) draws the frame at T seconds. Every frame is a pure function of T.
const W = 1080, H = 1920, cv = document.getElementById('cv'), c = cv.getContext('2d');
const C = { bg: '#efe8dc', ink: '#171512', or: '#f0502a', orL: '#fde3d9', card: '#fffdf8', mut: '#8c8478', line: '#ddd4c6', gold: '#f2b632', goldD: '#c98b1c', green: '#2f9e5b',
  skin: '#f3caa6', skinD: '#dda580', beard: '#3b2a20', hat: '#e2a32b', hatD: '#c78a19', jacket: '#5d6c50', jacketD: '#4b5941', tee: '#fbf9f4' };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, k) => a + (b - a) * k;
const out = k => 1 - Math.pow(1 - clamp(k), 3), inout = k => (k = clamp(k), k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const back = k => { k = clamp(k); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const F = { sg: (n, w = 600) => `${w} ${n}px SG`, ser: n => `italic 400 ${n}px IS`, mono: (n, w = 500) => `${w} ${n}px JB` };
let X = c;   // the context every draw function paints into (main canvas, or the shadow buffer)

// ---------- primitives ----------
function rr(x, y, w, h, r) { X.beginPath(); X.roundRect(x, y, w, h, r); }
function box(x, y, w, h, r = 26, fill = C.card, lw = 5) { rr(x, y, w, h, r); X.fillStyle = fill; X.fill(); X.lineWidth = lw; X.strokeStyle = C.ink; X.stroke(); }
function txt(s, x, y, font, col = C.ink, align = 'center', base = 'middle') { X.font = font; X.fillStyle = col; X.textAlign = align; X.textBaseline = base; X.fillText(s, x, y); }
function circ(x, y, r, fill, lw = 5) { X.beginPath(); X.arc(x, y, r, 0, Math.PI * 2); if (fill) { X.fillStyle = fill; X.fill(); } if (lw) { X.lineWidth = lw; X.strokeStyle = C.ink; X.stroke(); } }
function line(pts, lw = 5, col = C.ink) { X.beginPath(); pts.forEach(([x, y], i) => i ? X.lineTo(x, y) : X.moveTo(x, y)); X.lineWidth = lw; X.strokeStyle = col; X.lineCap = 'round'; X.lineJoin = 'round'; X.stroke(); }
function pill(s, x, y, font, bg, fg, pad = 22, h = 56) { X.font = font; const w = X.measureText(s).width + pad * 2; box(x - w / 2, y - h / 2, w, h, h / 2, bg, 4); txt(s, x, y + 2, font, fg); return w; }
function fmt(n, pre = '', suf = '') { return pre + Math.round(n).toLocaleString('en-US') + suf; }
function check(x, y, s = 1, col = C.or) { line([[x - 16 * s, y], [x - 4 * s, y + 13 * s], [x + 18 * s, y - 14 * s]], 9 * s, col); }
function cross(x, y, s = 1, col = C.ink) { line([[x - 14 * s, y - 14 * s], [x + 14 * s, y + 14 * s]], 8 * s, col); line([[x + 14 * s, y - 14 * s], [x - 14 * s, y + 14 * s]], 8 * s, col); }

// ---------- paper and halftone ----------
function patternOf(size, r, col, ctx) { const p = document.createElement('canvas'); p.width = p.height = size; const q = p.getContext('2d'); q.fillStyle = col; q.beginPath(); q.arc(size / 2, size / 2, r, 0, 7); q.fill(); return ctx.createPattern(p, 'repeat'); }
const SH = document.createElement('canvas'); SH.width = W; SH.height = H; const sx = SH.getContext('2d');
const DOTS = patternOf(9, 2.4, C.ink, sx), PAPER = patternOf(7, .9, 'rgba(60,40,20,.13)', c);
function paper() { c.fillStyle = C.bg; c.fillRect(0, 0, W, H); c.fillStyle = PAPER; c.fillRect(0, 0, W, H);
  const g = c.createRadialGradient(W / 2, H * .45, 200, W / 2, H * .5, 1250); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(120,90,60,.12)'); c.fillStyle = g; c.fillRect(0, 0, W, H); }
// draws fn twice: first as a dotted halftone shadow offset down-right, then for real
function withShadow(fn, dx = 15, dy = 15) { sx.setTransform(1, 0, 0, 1, 0, 0); sx.globalCompositeOperation = 'source-over'; sx.clearRect(0, 0, W, H); X = sx; fn();
  sx.setTransform(1, 0, 0, 1, 0, 0); sx.globalCompositeOperation = 'source-in'; sx.fillStyle = DOTS; sx.fillRect(0, 0, W, H); sx.globalCompositeOperation = 'source-over';
  c.drawImage(SH, dx, dy); X = c; fn(); }

// ---------- the presenter ----------
const HC = { x: 540, y: 1440 }, SHO = [{ x: -285, y: 245 }, { x: 285, y: 245 }], L1 = 225, L2 = 220;
const POSES = {   // hand targets relative to the head centre; L is the arm on the viewer's left
  idle: { L: [-305, 700, 'open'], R: [305, 700, 'open'] },
  point: { L: [-330, -195, 'point'], R: [305, 700, 'open'] },
  present: { L: [-400, -40, 'open'], R: [305, 700, 'open'] },
  wave: { L: [-340, -170, 'open'], R: [305, 700, 'open'] },
  shy: { L: [-305, 700, 'open'], R: [45, 105, 'open'] },
  think: { L: [-305, 700, 'open'], R: [25, 228, 'fist'] },
  shrug: { L: [-410, 40, 'open'], R: [410, 40, 'open'] },
  cheer: { L: [-330, -190, 'fist'], R: [330, -190, 'fist'] },
  thumbs: { L: [-340, 70, 'thumb'], R: [305, 700, 'open'] },
  facepalm: { L: [-305, 700, 'open'], R: [-10, -40, 'open'] },
  count: { L: [-305, 700, 'open'], R: [360, -120, 'point'] },
};
const FACES = {
  smile: { smile: .7, brow: 0, tilt: 0, open: 0, eyes: 0, sweat: 0, look: [0, 0], blush: .2 },
  grin: { smile: 1, brow: .25, tilt: 0, open: .45, eyes: 0, sweat: 0, look: [0, 0], blush: .4 },
  happy: { smile: 1, brow: .3, tilt: 0, open: .35, eyes: 1, sweat: 0, look: [0, 0], blush: .5 },
  worried: { smile: -.45, brow: .55, tilt: -1, open: 0, eyes: 0, sweat: 1, look: [.6, .2], blush: 0 },
  wow: { smile: 0, brow: 1, tilt: 0, open: .85, eyes: 0, sweat: 0, look: [0, -.2], blush: .1 },
  smug: { smile: .55, brow: .1, tilt: .8, open: 0, eyes: 0, sweat: 0, look: [.9, 0], blush: 0 },
  sad: { smile: -.75, brow: .45, tilt: -1, open: 0, eyes: 0, sweat: 0, look: [0, .5], blush: 0 },
  think: { smile: .1, brow: .35, tilt: .6, open: 0, eyes: 0, sweat: 0, look: [.8, -.8], blush: 0 },
};
function ik(S, T, side) { const dx = T.x - S.x, dy = T.y - S.y; let d = Math.hypot(dx, dy); d = clamp(d, 40, L1 + L2 - 2);
  const a = Math.atan2(dy, dx), A = Math.acos(clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));
  const cand = [a + A, a - A].map(g => ({ x: S.x + Math.cos(g) * L1, y: S.y + Math.sin(g) * L1 })); const score = E => side * (E.x - S.x) + .6 * (E.y - S.y);
  const E = score(cand[0]) > score(cand[1]) ? cand[0] : cand[1]; const f = Math.hypot(dx, dy) > L1 + L2 - 2 ? (L1 + L2 - 2) / Math.hypot(dx, dy) : 1;
  return { E, T: { x: S.x + dx * f, y: S.y + dy * f } }; }
function hand(kind, side, a) { // local frame: +x runs along the forearm toward the fingers; side flips the thumb
  const sk = () => { X.fillStyle = C.skin; X.fill(); X.lineWidth = 5; X.strokeStyle = C.ink; X.stroke(); };
  const fing = (x0, x1, y, w) => { rr(x0, y - w / 2, x1 - x0, w, w / 2); sk(); };
  if (kind === 'open') { [-30, -11, 8, 27].forEach((y, i) => fing(40, 100 - Math.abs(i - 1.5) * 9, y * side, 19)); X.save(); X.rotate(-.9 * side); fing(10, 72, -34 * side, 21); X.restore(); rr(-14, -42, 76, 84, 30); sk(); }
  else if (kind === 'point') { fing(36, 128, -22 * side, 23); [-2, 15, 31].forEach(y => fing(30, 70, y * side, 19)); rr(-14, -40, 74, 80, 30); sk(); X.save(); X.rotate(-1.2 * side); fing(14, 62, -30 * side, 21); X.restore(); }
  else { if (kind === 'thumb') { X.save(); X.rotate(-a); rr(-16, -110, 34, 100, 17); sk(); X.restore(); }
    rr(-14, -42, 82, 84, 32); sk(); [-28, -10, 8, 26].forEach(y => { X.beginPath(); X.arc(64, y * side, 11, -1.6, 1.6); X.lineWidth = 4; X.strokeStyle = C.ink; X.stroke(); }); }
}
function arm(i, tgt, kind, wobble) { const side = i ? 1 : -1, S = SHO[i]; const { E, T } = ik(S, tgt, side);
  line([[S.x, S.y], [E.x, E.y], [T.x, T.y]], 104, C.ink); line([[S.x, S.y], [E.x, E.y], [T.x, T.y]], 92, C.jacket);
  const a = Math.atan2(T.y - E.y, T.x - E.x), cuff = { x: T.x - Math.cos(a) * 36, y: T.y - Math.sin(a) * 36 };
  line([[cuff.x, cuff.y], [T.x - Math.cos(a) * 30, T.y - Math.sin(a) * 30]], 96, C.ink); line([[cuff.x, cuff.y], [T.x - Math.cos(a) * 31, T.y - Math.sin(a) * 31]], 86, C.jacketD);
  X.save(); X.translate(T.x - Math.cos(a) * 6, T.y - Math.sin(a) * 6); X.rotate(a + (wobble || 0)); hand(kind, i ? 1 : -1, a + (wobble || 0)); X.restore(); }
function torso() {
  X.beginPath(); X.moveTo(-430, 520); X.lineTo(-395, 330); X.quadraticCurveTo(-375, 230, -250, 215); X.lineTo(250, 215); X.quadraticCurveTo(375, 230, 395, 330); X.lineTo(430, 520); X.closePath();
  X.fillStyle = C.jacket; X.fill(); X.lineWidth = 6; X.strokeStyle = C.ink; X.stroke();
  X.beginPath(); X.moveTo(-118, 212); X.lineTo(118, 212); X.lineTo(92, 520); X.lineTo(-92, 520); X.closePath(); X.fillStyle = C.tee; X.fill(); X.stroke();
  [-1, 1].forEach(s => { X.beginPath(); X.moveTo(s * 118, 212); X.lineTo(s * 170, 215); X.lineTo(s * 128, 380); X.lineTo(s * 95, 470); X.closePath(); X.fillStyle = C.jacketD; X.fill(); X.lineWidth = 5; X.stroke(); });
  [[-150, 360], [-140, 460]].forEach(([x, y]) => circ(x, y, 7, C.ink, 0));
  X.beginPath(); X.arc(0, 205, 62, .15, Math.PI - .15); X.lineWidth = 5; X.strokeStyle = C.ink; X.stroke();
  rr(-58, 140, 116, 80, 20); X.fillStyle = C.skin; X.fill(); X.lineWidth = 5; X.stroke(); X.fillStyle = C.skinD; X.fillRect(-55, 150, 110, 26);
}
function head(f, T) {
  // ears and sideburn hair
  [-1, 1].forEach(s => { X.beginPath(); X.ellipse(s * 150, 15, 30, 40, 0, 0, 7); X.fillStyle = C.skin; X.fill(); X.lineWidth = 5; X.strokeStyle = C.ink; X.stroke(); });
  rr(-150, -175, 300, 355, 128); X.fillStyle = C.skin; X.fill(); X.lineWidth = 6; X.strokeStyle = C.ink; X.stroke();
  [-1, 1].forEach(s => { X.beginPath(); X.moveTo(s * 150, -110); X.lineTo(s * 128, -110); X.lineTo(s * 132, 40); X.lineTo(s * 152, 60); X.closePath(); X.fillStyle = C.beard; X.fill(); });
  if (f.blush > .05) [-1, 1].forEach(s => { X.beginPath(); X.ellipse(s * 82, 45, 30, 16, 0, 0, 7); X.fillStyle = `rgba(240,110,90,${.3 * f.blush})`; X.fill(); });
  // beard with the mouth cut-out
  X.beginPath(); X.moveTo(-150, 25); X.bezierCurveTo(-150, 165, -85, 240, 0, 240); X.bezierCurveTo(85, 240, 150, 165, 150, 25);
  X.bezierCurveTo(136, 68, 106, 82, 72, 84); X.bezierCurveTo(44, 64, -44, 64, -72, 84); X.bezierCurveTo(-106, 82, -136, 68, -150, 25);
  X.fillStyle = C.beard; X.fill(); X.lineWidth = 6; X.strokeStyle = C.ink; X.stroke();
  // nose
  X.beginPath(); X.ellipse(0, 22, 23, 30, 0, 0, 7); X.fillStyle = C.skinD; X.fill(); X.beginPath(); X.ellipse(-7, 12, 8, 11, 0, 0, 7); X.fillStyle = 'rgba(255,255,255,.35)'; X.fill();
  // mouth
  const o = clamp(f.open), sm = f.smile, my = 122;
  if (o < .06) { const d = sm * 20;
    X.beginPath(); X.moveTo(-52, my - d * .4); X.quadraticCurveTo(0, my + d * 1.4, 52, my - d * .4); X.lineWidth = 7; X.strokeStyle = C.ink; X.lineCap = 'round'; X.stroke(); }
  else { const w = 58 - o * 10, h = 14 + o * 62, cy = my - 6 - sm * 6;
    X.save(); X.beginPath(); X.moveTo(-w, cy); X.quadraticCurveTo(0, cy - 10 + sm * 8, w, cy); X.quadraticCurveTo(w * .7, cy + h, 0, cy + h + sm * 6); X.quadraticCurveTo(-w * .7, cy + h, -w, cy); X.closePath();
    X.fillStyle = '#3a1210'; X.fill(); X.clip(); X.fillStyle = '#fff'; X.fillRect(-w, cy - 14, w * 2, 22); X.beginPath(); X.ellipse(0, cy + h + 4, w * .6, h * .45, 0, 0, 7); X.fillStyle = '#e0524a'; X.fill(); X.restore();
    X.beginPath(); X.moveTo(-w, cy); X.quadraticCurveTo(0, cy - 10 + sm * 8, w, cy); X.quadraticCurveTo(w * .7, cy + h, 0, cy + h + sm * 6); X.quadraticCurveTo(-w * .7, cy + h, -w, cy); X.closePath(); X.lineWidth = 6; X.strokeStyle = C.ink; X.stroke(); }
  // eyes
  const blink = (T % 3.7) < .12 ? 1 : 0, ex = [-62, 62], ey = -38;
  ex.forEach(x => { if (f.eyes > .5) { X.beginPath(); X.arc(x, ey + 8, 17, Math.PI * 1.15, Math.PI * 1.85); X.lineWidth = 7; X.strokeStyle = C.ink; X.stroke(); return; }
    if (blink) { line([[x - 18, ey], [x + 18, ey]], 6); return; }
    X.beginPath(); X.ellipse(x, ey, 22, 17, 0, 0, 7); X.fillStyle = '#fff'; X.fill(); X.lineWidth = 3.5; X.strokeStyle = C.ink; X.stroke();
    circ(x + f.look[0] * 8, ey + f.look[1] * 5, 11, C.ink, 0); circ(x + f.look[0] * 8 + 4, ey + f.look[1] * 5 - 4, 3.5, '#fff', 0); });
  // glasses
  ex.forEach(x => { X.beginPath(); X.arc(x, ey, 56, 0, 7); X.fillStyle = 'rgba(255,255,255,.16)'; X.fill(); X.lineWidth = 8; X.strokeStyle = C.ink; X.stroke(); });
  line([[-8, ey - 6], [0, ey - 12], [8, ey - 6]], 7); line([[-118, ey - 10], [-150, ey - 16]], 7); line([[118, ey - 10], [150, ey - 16]], 7);
  // brows
  [-1, 1].forEach(s => { const y = -118 - f.brow * 16, inner = -f.tilt * 10 * (s === 1 && f.tilt > 0 ? -1 : 1);
    line([[s * 100, y + 6], [s * 30, y - inner]], 17, C.beard); });
  // beanie
  X.beginPath(); X.moveTo(-168, -150); X.bezierCurveTo(-170, -330, 170, -330, 168, -150); X.closePath(); X.fillStyle = C.hat; X.fill(); X.lineWidth = 6; X.strokeStyle = C.ink; X.stroke();
  X.beginPath(); X.moveTo(-60, -270); X.quadraticCurveTo(10, -300, 80, -262); X.lineWidth = 5; X.strokeStyle = 'rgba(0,0,0,.18)'; X.stroke();
  rr(-176, -175, 352, 78, 34); X.fillStyle = C.hatD; X.fill(); X.lineWidth = 6; X.strokeStyle = C.ink; X.stroke();
  X.save(); rr(-176, -175, 352, 78, 34); X.clip(); for (let x = -170; x < 176; x += 17) line([[x, -170], [x, -100]], 3, 'rgba(0,0,0,.28)'); X.restore();
  rr(-150, -155, 52, 34, 6); X.fillStyle = C.ink; X.fill(); X.fillStyle = C.or; X.fillRect(-140, -142, 32, 8);
  // sweat
  if (f.sweat > .05) [[-125, -90], [128, -70]].forEach(([x, y], i) => { const yy = y + ((T * 40 + i * 20) % 30); X.beginPath(); X.moveTo(x, yy - 22); X.quadraticCurveTo(x + 14, yy, x, yy + 10); X.quadraticCurveTo(x - 14, yy, x, yy - 22);
    X.fillStyle = '#e8f6ff'; X.fill(); X.lineWidth = 4; X.strokeStyle = C.ink; X.stroke(); });
}
function presenter(st, T) { X.save(); X.translate(HC.x, HC.y + st.bob); torso(); X.save(); X.rotate(st.tilt * .06); head(st.face, T); X.restore();
  [0, 1].forEach(i => { const h = st.hands[i]; arm(i, { x: h[0], y: h[1] }, h[2], h[3]); }); X.restore(); }

// ---------- props (drawn centred on 0,0; k = progress through the beat, 0..1) ----------
const PROPS = {
  versus(p, k) { [p.a, p.b].forEach((s, i) => { const kk = back((k - i * .1) * 3.5); if (kk <= 0) return; X.save(); X.translate((i ? 1 : -1) * 222, 0); X.scale(kk, kk);
      const hi = p.win === (i ? 'b' : 'a'); box(-200, -185, 400, 370, 30, hi ? C.orL : C.card, hi ? 7 : 5); txt(s.t, 0, -125, F.mono(28, 700), hi ? C.or : C.mut);
      fitText(s.big, 0, -15, 320, 88, hi ? C.or : C.ink); txt(s.sub || '', 0, 95, F.mono(28), C.ink); X.restore(); });
    const kv = back((k - .2) * 4); if (kv > 0) { X.save(); X.scale(kv, kv); circ(0, 0, 42, C.ink, 0); txt('VS', 0, 3, F.sg(34, 700), '#fff'); X.restore(); } },
  timeline(p, k) { box(-450, -200, 900, 400); const x0 = -330, x1 = 400, X0 = v => lerp(x0, x1, (v - p.min) / (p.max - p.min));
    p.rows.forEach(([lab, a, b, col], i) => { const y = -80 + i * 120, e = out((k - .1 - i * .15) * 2.2); txt(lab, -420, y, F.mono(30, 700), C.ink, 'left');
      if (e > 0) { rr(X0(a), y - 26, Math.max(52, (X0(b) - X0(a)) * e), 52, 26); X.fillStyle = col; X.fill(); X.lineWidth = 5; X.strokeStyle = C.ink; X.stroke(); } txt(String(a), X0(a) + 12, y + 2, F.mono(26, 700), '#fff', 'left'); });
    line([[x0, 150], [x1, 150]], 4, C.mut); p.ticks.forEach(v => { line([[X0(v), 140], [X0(v), 160]], 4, C.mut); txt(String(v), X0(v), 182, F.mono(24), C.mut); }); },
  stat(p, k) { box(-430, -190, 860, 380); const e = out(k * 2.2); const s = p.to !== undefined ? fmt(lerp(p.from || 0, p.to, e), p.pre || '', p.suf || '') : p.big;
    X.save(); X.scale(back(k * 4), back(k * 4)); fitText(s, 0, -30, 780, 190, p.col || C.or); X.restore(); txt(p.sub || '', 0, 120, F.mono(28, 700), C.mut); },
  bank(p, k) { box(-380, -220, 760, 440); circ(-320, -160, 16, C.or, 0); txt('MY BANK', -290, -158, F.mono(28, 700), C.ink, 'left'); txt('•••• 4821', 330, -158, F.mono(26), C.mut, 'right');
    txt(p.label, -320, -80, F.mono(28), C.mut, 'left'); const v = lerp(p.from || 0, p.to, inout((k - .1) * 1.6)); fitText(fmt(v, p.pre ?? '$'), -320, 30, 640, 130, v < 0 ? C.or : C.ink, 'left');
    if (p.chip && k > .55) pill(p.chip, -320 + 120, 145, F.mono(28, 700), p.chipCol || C.orL, C.ink); },
  chart(p, k) { box(-450, -235, 900, 470); const px = -380, py = 170, pw = 740, ph = 330; line([[px, py - ph], [px, py], [px + pw, py]], 4, C.mut);
    if (p.title) txt(p.title, px + 10, -200, F.mono(26, 700), C.mut, 'left'); const mx = p.max || Math.max(...p.series.flatMap(s => s.pts));
    p.series.forEach((s, si) => { const n = s.pts.length - 1, e = clamp((k - .08) * 1.5), m = Math.max(1, e * n); const pts = [];
      for (let i = 0; i <= Math.floor(m); i++) pts.push([px + i / n * pw, py - s.pts[i] / mx * ph]); const fi = Math.floor(m), fr = m - fi;
      if (fi < n) pts.push([px + (fi + fr) / n * pw, py - lerp(s.pts[fi], s.pts[fi + 1], fr) / mx * ph]); line(pts, 10, s.col || C.or); const L = pts[pts.length - 1]; circ(L[0], L[1], 11, s.col || C.or, 4);
      if (e > .97 && s.end) pill(s.end, Math.min(L[0] - 40, 260), L[1] - 50 - si * 4, F.mono(28, 700), s.col === C.ink ? '#fff' : C.orL, C.ink); });
