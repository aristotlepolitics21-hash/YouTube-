<!doctype html><meta charset="utf-8">
<style>body { margin: 0; background: #000; }</style>
<canvas id="cv" width="1080" height="1920"></canvas>
<script>
// 100 Business Ideas: desi cartoon skits. Thick ink outlines, flat colours, a shop with a big sign banner, characters in
// lungi/vest, kurta and Gandhi topi, saree, shirt; a white dialogue box, money stickers and a "life set" finish.
// window.setup(data) loads the beats; window.__at(T) draws the frame at T seconds. Every frame is a pure function of T.
const W = 1080, H = 1920, GY = 1560, INK = '#1d1410', LW = 7, cv = document.getElementById('cv'), c = cv.getContext('2d');
const F = (w, s) => `${w} ${s}px Inter, "Noto Color Emoji", sans-serif`;
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, k) => a + (b - a) * k, out = k => 1 - Math.pow(1 - cl(k), 3);
const back = k => { k = cl(k); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
let BEATS = [], EP = {}, CAST = {};

window.setup = async (d) => { await Promise.all([F(900, 40), F(800, 40), F(700, 40)].map(f => document.fonts.load(f))); EP = d.ep; CAST = castFrom(d.ep.cast);
  let t = 0, prev = { bg: 'street', cast: [], pose: {}, expr: {}, hold: {} };
  BEATS = d.beats.map((b, i) => { const o = { bg: b.bg || prev.bg, cast: b.cast || prev.cast, pose: { ...(b.bg ? {} : prev.pose), ...(b.pose || {}) }, expr: { ...(b.bg ? {} : prev.expr), ...(b.expr || {}) },
      hold: { ...(b.bg ? {} : prev.hold), ...(b.hold || {}) }, fx: b.fx || {}, stat: b.stat, final: b.final, i, who: d.speakers[i], start: t, end: t + d.durs[i], cap: d.caps[i], text: d.texts[i] };
    o.newScene = !!b.bg && i > 0; t += d.durs[i]; prev = o; return o; });
  window.__total = t; return t; };

// ---------- drawing helpers ----------
function ink(fill, lw = LW) { if (fill) { c.fillStyle = fill; c.fill(); } c.lineWidth = lw; c.strokeStyle = INK; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke(); }
function rr(x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function ell(x, y, rx, ry, rot = 0) { c.beginPath(); c.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, Math.PI * 2); }
function poly(pts, close = true) { c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); if (close) c.closePath(); }
function limb(pts, w, col) { poly(pts, false); c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = INK; c.lineWidth = w + LW * 2; c.stroke(); c.strokeStyle = col; c.lineWidth = w; c.stroke(); }
function txt(s, x, y, font, col, align = 'center', base = 'alphabetic') { c.font = font; c.fillStyle = col; c.textAlign = align; c.textBaseline = base; c.fillText(s, x, y); }
function otxt(s, x, y, font, col, sw = 12, align = 'center') { c.font = font; c.textAlign = align; c.textBaseline = 'alphabetic'; c.lineJoin = 'round'; c.lineWidth = sw; c.strokeStyle = INK; c.strokeText(s, x, y); c.fillStyle = col; c.fillText(s, x, y); }
function fitFont(s, w, max, min = 30, weight = 900) { let f = max; c.font = F(weight, f); while (c.measureText(s).width > w && f > min) { f -= 2; c.font = F(weight, f); } return f; }
function checks(x, y, w, h, base, line, step = 26) { c.save(); c.clip(); c.fillStyle = base; c.fillRect(x, y, w, h); c.strokeStyle = line; c.lineWidth = 7; c.globalAlpha = .55;
  for (let a = x - h; a < x + w + h; a += step) { c.beginPath(); c.moveTo(a, y); c.lineTo(a, y + h); c.stroke(); }
  for (let b = y; b < y + h; b += step) { c.beginPath(); c.moveTo(x, b); c.lineTo(x + w, b); c.stroke(); } c.restore(); }

// ---------- backgrounds ----------
function sky() { const g = c.createLinearGradient(0, 0, 0, 1300); g.addColorStop(0, '#5fb8ec'); g.addColorStop(1, '#c9ecfa'); c.fillStyle = g; c.fillRect(0, 0, W, 1340);
  [[160, 300, 1], [820, 230, .8], [520, 420, .6]].forEach(([x, y, s]) => { c.save(); c.translate(x, y); c.scale(s, s); c.beginPath(); c.arc(-50, 10, 45, 0, 7); c.arc(0, -15, 60, 0, 7); c.arc(55, 8, 45, 0, 7); c.fillStyle = '#fff'; c.fill(); c.restore(); }); }
function buildings() { const cols = ['#f2a65a', '#f7d06b', '#8fc5a3', '#e98b8b', '#b9a3e3', '#7fb7d6'];
  [[-20, 760, 230], [200, 620, 210], [400, 820, 260], [650, 680, 220], [860, 780, 240]].forEach(([x, top, w], i) => { rr(x, top, w, 1340 - top, 6); ink(cols[i % 6]);
    for (let wy = top + 50; wy < 1240; wy += 120) for (let wx = x + 30; wx < x + w - 60; wx += 85) { rr(wx, wy, 52, 70, 4); ink('#2d4f6c', 5); c.beginPath(); c.moveTo(wx + 26, wy); c.lineTo(wx + 26, wy + 70); c.lineWidth = 4; c.strokeStyle = INK; c.stroke(); }
    rr(x + w - 90, top - 70, 70, 70, 8); ink('#e8e2d0', 5); });
  // electric pole and sagging wires
  rr(990, 560, 26, 800, 4); ink('#8a8f99'); rr(950, 600, 106, 16, 3); ink('#8a8f99', 5);
  c.lineWidth = 4; c.strokeStyle = INK; [0, 1, 2].forEach(k => { c.beginPath(); c.moveTo(-10, 520 + k * 24); c.quadraticCurveTo(500, 640 + k * 24, 1003, 604 + k * 4); c.stroke(); }); }
function footpath(col = '#d8c39b') { c.fillStyle = col; c.fillRect(0, 1340, W, H - 1340); c.beginPath(); c.moveTo(0, 1340); c.lineTo(W, 1340); c.lineWidth = LW; c.strokeStyle = INK; c.stroke();
  c.strokeStyle = 'rgba(29,20,16,.25)'; c.lineWidth = 4; for (let x = -100; x < W; x += 180) { c.beginPath(); c.moveTo(x + 60, 1340); c.lineTo(x, H); c.stroke(); } c.beginPath(); c.moveTo(0, 1640); c.lineTo(W, 1640); c.stroke(); }
function street() { sky(); buildings(); footpath();
  rr(80, 1110, 210, 230, 10); ink('#3aa76d'); rr(60, 1080, 250, 50, 10); ink('#e24b4b'); txt('STD · PCO', 185, 1118, F(900, 28), '#fff'); rr(110, 1160, 150, 80, 6); ink('#ffe8a8', 5); }
function home() { c.fillStyle = '#f5d39b'; c.fillRect(0, 0, W, 1340); c.fillStyle = '#e7b877'; c.fillRect(0, 1060, W, 280); c.beginPath(); c.moveTo(0, 1060); c.lineTo(W, 1060); c.lineWidth = 5; c.strokeStyle = INK; c.stroke();
  rr(110, 420, 330, 380, 10); ink('#8fd3f4'); c.lineWidth = 7; for (let x = 150; x < 440; x += 48) { c.beginPath(); c.moveTo(x, 420); c.lineTo(x, 800); c.stroke(); } rr(90, 400, 370, 420, 12); c.lineWidth = 16; c.strokeStyle = '#7a4b2a'; c.stroke(); c.lineWidth = 5; c.strokeStyle = INK; c.stroke();
  rr(700, 470, 200, 250, 8); ink('#fff'); rr(700, 470, 200, 70, 8); ink('#e24b4b'); txt('2026', 800, 520, F(900, 40), '#fff'); for (let r = 0; r < 4; r++) for (let k = 0; k < 5; k++) { rr(720 + k * 36, 560 + r * 38, 24, 24, 4); c.fillStyle = (r * 5 + k) % 7 === 3 ? '#e24b4b' : '#cfc6b5'; c.fill(); }
  c.beginPath(); c.moveTo(560, 0); c.lineTo(560, 260); c.lineWidth = 5; c.strokeStyle = INK; c.stroke(); ell(560, 300, 34, 44); ink('#fff6b0'); rr(540, 248, 40, 24, 4); ink('#9a9a9a', 5);
  c.fillStyle = '#c4935f'; c.fillRect(0, 1340, W, H - 1340); c.beginPath(); c.moveTo(0, 1340); c.lineTo(W, 1340); c.lineWidth = LW; c.strokeStyle = INK; c.stroke();
  // charpai (woven cot)
  rr(640, 1240, 420, 70, 10); ink('#f0d9a8'); c.save(); rr(640, 1240, 420, 70, 10); c.clip(); c.strokeStyle = '#b48a52'; c.lineWidth = 5; for (let x = 600; x < 1100; x += 24) { c.beginPath(); c.moveTo(x, 1240); c.lineTo(x + 70, 1310); c.stroke(); } c.restore();
  rr(640, 1230, 420, 22, 8); ink('#8a5a30'); [660, 1030].forEach(x => { rr(x, 1250, 24, 150, 6); ink('#8a5a30'); }); }
function nimbuMirchi(x, y) { c.beginPath(); c.moveTo(x, y); c.lineTo(x, y + 120); c.lineWidth = 3; c.strokeStyle = INK; c.stroke();
  [0, 1, 2].forEach(k => { ell(x + (k - 1) * 10, y + 70 + k * 18, 9, 22, (k - 1) * .3); ink('#2fa84f', 4); }); ell(x, y + 140, 22, 20); ink('#ffe14d', 5); }
function shop() { sky(); buildings(); footpath(); const k = EP.kind;
  rr(50, 330, 980, 1010, 10); ink(EP.wall || '#f4e1b5');
  rr(110, 560, 860, 780, 6); ink('#6b4a32'); c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(110, 560, 860, 60);

  rr(110, 540, 860, 44, 6); ink('#a7adb6', 5); for (let x = 130; x < 970; x += 30) { c.beginPath(); c.moveTo(x, 548); c.lineTo(x, 578); c.lineWidth = 3; c.strokeStyle = 'rgba(29,20,16,.4)'; c.stroke(); }
  // awning scallops then the big sign board
  for (let x = 50; x < 1030; x += 70) { c.beginPath(); c.moveTo(x, 500); c.lineTo(x + 70, 500); c.lineTo(x + 70, 525); c.arc(x + 35, 525, 35, 0, Math.PI); c.closePath(); ink(((x - 50) / 70) % 2 ? '#fff' : (EP.awning || '#e63946'), 5); }
  rr(40, 330, 1000, 180, 14); ink(EP.signColor || '#ffd23f'); rr(58, 348, 964, 144, 10); c.lineWidth = 4; c.strokeStyle = INK; c.stroke();
  const fs = fitFont(EP.sign, 900, 112); otxt(EP.sign, 540, 420 + fs * .36, F(900, fs), EP.signText || '#d62828', 14);
  nimbuMirchi(120, 540); PROPS[k] && PROPS[k](); }

let NOW = 0;
function hills() { ell(220, 1070, 520, 230); ink('#8fcf6b', 5); ell(860, 1090, 540, 210); ink('#7fbf5f', 5); }
function tree(x, y, s = 1) { c.save(); c.translate(x, y); c.scale(s, s); rr(-18, -200, 36, 200, 8); ink('#8a5a30'); [[-60, -230, 70], [50, -240, 76], [0, -300, 84]].forEach(([dx, dy, r]) => { ell(dx, dy, r, r); ink('#3f9a4a'); }); c.restore(); }
function hut(x, y) { rr(x, y - 170, 220, 170, 4); ink('#d9a066'); rr(x + 80, y - 110, 60, 110, 4); ink('#5a3a22'); poly([[x - 30, y - 160], [x + 110, y - 280], [x + 250, y - 160]]); ink('#e0b04a');
  for (let i = 0; i < 8; i++) { c.beginPath(); c.moveTo(x + 110, y - 270); c.lineTo(x - 20 + i * 36, y - 165); c.lineWidth = 3; c.strokeStyle = 'rgba(29,20,16,.35)'; c.stroke(); } }
function field() { c.fillStyle = '#a5d65f'; c.fillRect(0, 1040, W, 300); c.beginPath(); c.moveTo(0, 1040); c.lineTo(W, 1040); c.lineWidth = 5; c.strokeStyle = INK; c.stroke();
  c.strokeStyle = '#4f9a3a'; c.lineWidth = 5; for (let y = 1070, r = 0; y < 1335; y += 34, r++) for (let x = (r % 2) * 23; x < W; x += 46) { c.beginPath(); c.moveTo(x - 8, y); c.lineTo(x - 12, y - 14); c.moveTo(x, y); c.lineTo(x, y - 18); c.moveTo(x + 8, y); c.lineTo(x + 12, y - 14); c.stroke(); } }
function dirt() { c.fillStyle = '#c9a26b'; c.fillRect(0, 1340, W, H - 1340); c.beginPath(); c.moveTo(0, 1340); c.lineTo(W, 1340); c.lineWidth = LW; c.strokeStyle = INK; c.stroke();
  for (let i = 0; i < 18; i++) { ell(hash(i) * W, 1380 + hash(i + 3) * 500, 10 + hash(i + 7) * 10, 6); c.fillStyle = 'rgba(29,20,16,.15)'; c.fill(); } }
function farm() { sky(); hills(); field(); tree(930, 1060, 1); hut(60, 1060); dirt(); }
function farmshop() { sky(); hills(); field(); tree(1000, 1040, .7); dirt();
  [130, 950].forEach(x => { rr(x - 16, 480, 32, 860, 6); ink('#8a5a30'); });
  rr(40, 330, 1000, 180, 14); ink('#8a5a30'); rr(58, 348, 964, 144, 10); ink(EP.signColor || '#ffd23f', 5);
  const fs = fitFont(EP.sign, 900, 112); otxt(EP.sign, 540, 420 + fs * .36, F(900, fs), EP.signText || '#d62828', 14); PROPS[EP.kind] && PROPS[EP.kind](); }
function cow(x, y, f = 1, col = '#fff', s = 1) { c.save(); c.translate(x, y); c.scale(f * s, s); const sw = Math.sin(NOW * 2 + x) * 10, nod = Math.sin(NOW * 1.3 + x) * 4;
  c.beginPath(); c.moveTo(-145, -190); c.quadraticCurveTo(-175 + sw, -140, -165 + sw, -90); c.lineWidth = 6; c.strokeStyle = INK; c.stroke(); ell(-165 + sw, -84, 10, 16); ink(INK, 3);
  [-110, -70, 70, 110].forEach(lx => { rr(lx - 13, -130, 26, 126, 8); ink(col); rr(lx - 14, -14, 28, 14, 4); ink('#3b3b3b', 4); });
  ell(0, -170, 150, 75); ink(col); c.save(); ell(0, -170, 150, 75); c.clip(); [[-60, -195, 44, 30], [40, -145, 52, 32], [105, -205, 32, 26]].forEach(([a, b, rx, ry]) => { ell(a, b, rx, ry); c.fillStyle = col === '#fff' ? INK : '#5a3a22'; c.fill(); }); c.restore(); ell(0, -170, 150, 75); ink(null);
  ell(35, -100, 24, 14); ink('#f4b6b6', 4);
  c.save(); c.translate(0, nod); [[118, -262], [205, -262]].forEach(([a, b], i) => { ell(a, b, 24, 10, i ? .3 : -.3); ink(col, 4); }); [[142, -290, -1], [182, -290, 1]].forEach(([a, b, d]) => { c.beginPath(); c.moveTo(a, b + 10); c.quadraticCurveTo(a + d * 6, b - 10, a + d * 18, b - 14); c.lineWidth = 8; c.strokeStyle = '#e8dcc0'; c.stroke(); });
  ell(162, -232, 50, 58); ink(col); ell(176, -196, 36, 24); ink('#f4b6b6', 5); [166, 188].forEach(a => { ell(a, -196, 4, 5); c.fillStyle = INK; c.fill(); }); [[146, -248], [182, -248]].forEach(([a, b]) => { ell(a, b, 7, 8); c.fillStyle = INK; c.fill(); }); c.restore(); c.restore(); }
function goat(x, y, f = 1, col = '#fff', s = 1) { c.save(); c.translate(x, y); c.scale(f * s, s); const nod = Math.sin(NOW * 2.2 + x) * 5;
  [-60, -30, 40, 66].forEach(lx => { rr(lx - 7, -80, 14, 80, 5); ink(col, 5); }); ell(-84, -134, 10, 18, -.6); ink(col, 4);
  ell(0, -110, 88, 46); ink(col); c.save(); c.translate(0, nod); c.beginPath(); c.moveTo(78, -170); c.quadraticCurveTo(60, -220, 40, -214); c.lineWidth = 9; c.strokeStyle = '#8a7a60'; c.stroke();
  ell(98, -160, 28, 36, .3); ink(col); ell(74, -158, 9, 24, .9); ink(col, 4); poly([[108, -128], [120, -128], [112, -100]]); ink(col, 3); ell(104, -168, 5, 6); c.fillStyle = INK; c.fill(); c.restore(); c.restore(); }
function dog(x, y, f = 1, col = '#d9a066', s = 1) { c.save(); c.translate(x, y); c.scale(f * s, s); const wag = Math.sin(NOW * 12) * .5;
  c.save(); c.translate(-66, -84); c.rotate(-.8 + wag); rr(-6, -50, 12, 52, 6); ink(col, 5); c.restore();
  [-46, -20, 30, 54].forEach(lx => { rr(lx - 9, -60, 18, 60, 6); ink(col, 5); }); ell(0, -74, 72, 38); ink(col);
  ell(74, -116, 38, 36); ink(col); ell(106, -104, 22, 15); ink(col, 5); ell(124, -108, 7, 6); c.fillStyle = INK; c.fill(); ell(78, -126, 6, 7); c.fill(); ell(54, -112, 14, 28, .2); ink('#8a5a30', 4);

function bee(x, y) { ell(x, y, 11, 8); ink('#ffd23f', 3); c.beginPath(); c.moveTo(x - 2, y - 8); c.lineTo(x - 2, y + 8); c.lineWidth = 3; c.strokeStyle = INK; c.stroke(); ell(x - 2, y - 12, 7, 5); c.fillStyle = 'rgba(255,255,255,.85)'; c.fill(); }
function pot(x, y, s = 1, leaf = '#3aa76d', flower) { c.save(); c.translate(x, y); c.scale(s, s); poly([[-30, -50], [30, -50], [22, 0], [-22, 0]]); ink('#c8643c', 5);
  [[-18, -80, -.6], [18, -80, .6], [0, -100, 0]].forEach(([a, b, r]) => { ell(a, b, 14, 26, r); ink(leaf, 4); }); if (flower) { ell(0, -122, 12, 12); ink(flower, 4); } c.restore(); }

// ---------- props per business ----------

function standTyre(x, y, r = 80) { ell(x, y - r, r * .5, r); ink('#2a2a2e'); ell(x, y - r, r * .2, r * .45); ink('#9aa0a8', 5); }

const PROPS = {

  chai() { counter(); rr(190, 1070, 150, 60, 10); ink('#3b3b3b'); ell(265, 1070, 60, 14); ink('#ff8c1a', 5); steel(265, 1060, 120, 110); rr(310, 980, 60, 18, 8); ink('#9aa3ad', 5);
    for (let i = 0; i < 6; i++) glass(470 + i * 55, 1128); rr(800, 1020, 110, 110, 14); ink('rgba(220,235,240,.8)'); for (let i = 0; i < 3; i++) { ell(855, 1100 - i * 22, 40, 10); ink('#e0a64d', 4); }
    for (let i = 0; i < 4; i++) { rr(160 + i * 200, 800, 120, 140, 10); ink(['#ffcf4a', '#e24b4b', '#3aa76d', '#f28c28'][i]); } },
  mobile() { rr(130, 1080, 820, 260, 8); ink('rgba(200,230,240,.85)'); rr(110, 1060, 860, 30, 8); ink('#8a5a30');
    for (let i = 0; i < 6; i++) { rr(170 + i * 130, 1140, 70, 130, 12); ink('#22252b'); rr(178 + i * 130, 1150, 54, 104, 6); c.fillStyle = ['#5fb8ec', '#9b5de5', '#f15bb5', '#00bbf9', '#fee440', '#00f5d4'][i]; c.fill(); }
    rr(180, 620, 330, 300, 12); ink('#fff'); txt('MOBILE', 345, 720, F(900, 58), '#d62828'); txt('REPAIR', 345, 790, F(900, 58), INK); txt('Screen · Battery', 345, 860, F(800, 30), '#555');
    for (let r = 0; r < 2; r++) for (let k = 0; k < 4; k++) { rr(580 + k * 90, 640 + r * 160, 64, 120, 10); ink(['#e24b4b', '#3aa76d', '#ffcf4a', '#5fb8ec'][(r + k) % 4], 5); } },
  tiffin() { counter('#d9a066'); for (let i = 0; i < 5; i++) { const x = 220 + i * 140; for (let s = 0; s < 3; s++) steel(x, 1130 - s * 52, 100, 52); c.beginPath(); c.moveTo(x - 40, 974); c.quadraticCurveTo(x, 920, x + 40, 974); c.lineWidth = 9; c.strokeStyle = INK; c.stroke(); }
